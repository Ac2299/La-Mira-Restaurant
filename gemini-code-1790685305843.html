<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقييم التجربة | Downtown</title>
    <!-- مكتبة الخطوط والأيقونات العالمية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #c5a059;
            --primary-hover: #b08d46;
            --border-color: #e2e8f0;
            --star-color: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; transition: 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

        .feedback-container {
            background: var(--card-bg);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        /* أيقونة متحركة تعبيرية في الأعلى */
        .animated-icon {
            font-size: 3.5rem;
            color: var(--primary);
            margin-bottom: 15px;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 { font-size: 1.8rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px; }
        p.subtitle { color: var(--text-muted); font-size: 1rem; margin-bottom: 30px; }

        /* نظام تقييم النجوم التفاعلي */
        .rating-stars {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            direction: ltr; /* لضبط الترتيب من اليسار لليمين */
        }
        .rating-stars i {
            font-size: 2.2rem;
            color: #cbd5e1;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
        }
        .rating-stars i:hover,
        .rating-stars i.active {
            color: var(--star-color);
            transform: scale(1.15);
        }

        /* حقول الإدخال */
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: #fafafa;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
        }
        .form-group textarea { resize: none; height: 120px; }

        /* زر الإرسال الاحترافي */
        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(197, 160, 89, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .submit-btn:hover { background: var(--primary-hover); transform: translateY(-2px); }

        /* رسالة النجاح المخفية */
        .success-box {
            display: none;
            padding: 30px;
        }
        .success-box i {
            font-size: 4rem;
            color: #10b981;
            margin-bottom: 15px;
        }
        .success-box h2 { color: #10b981; margin-bottom: 10px; }
        .success-box p { color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="feedback-container">
        
        <!-- نموذج التقييم -->
        <div id="formContent">
            <!-- أيقونة متحركة تعبر عن تقييم الخدمة -->
            <div class="animated-icon">
                <i class="fa-solid fa-face-smile-beam"></i>
            </div>
            
            <h1>رأيك يهمنا جداً</h1>
            <p class="subtitle">ساعدنا في تحسين تجربتك وتقديم أفضل خدمة دائماً</p>

            <form id="feedbackForm" onsubmit="submitFeedback(event)">
                
                <!-- النجوم -->
                <div class="rating-stars" id="starContainer">
                    <i class="fa-solid fa-star" data-value="1"></i>
                    <i class="fa-solid fa-star" data-value="2"></i>
                    <i class="fa-solid fa-star" data-value="3"></i>
                    <i class="fa-solid fa-star" data-value="4"></i>
                    <i class="fa-solid fa-star" data-value="5"></i>
                </div>

                <div class="form-group">
                    <label>اسمك الكريم (اختياري)</label>
                    <input type="text" id="clientName" placeholder="اكتب اسمك هنا...">
                </div>

                <div class="form-group">
                    <label>ملاحظاتك أو اقتراحاتك</label>
                    <textarea id="clientNotes" placeholder="كيف كانت تجربتك معنا اليوم؟"></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    <span>إرسال التقييم</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>

        <!-- رسالة النجاح -->
        <div class="success-box" id="successBox">
            <i class="fa-solid fa-circle-check"></i>
            <h2>شكراً لك!</h2>
            <p>تم استلام تقييمك وملاحظاتك بنجاح، نسعد دائماً بخدمتك.</p>
        </div>

    </div>

    <script>
        // تفاعل تقييم النجوم
        const stars = document.querySelectorAll('.rating-stars i');
        let selectedRating = 0;

        stars.forEach(star => {
            star.addEventListener('click', () => {
                selectedRating = star.getAttribute('data-value');
                stars.forEach(s => {
                    if (s.getAttribute('data-value') <= selectedRating) {
                        s.classList.add('active');
                    } else {
                        s.classList.remove('active');
                    }
                });
            });
        });

        // دالة إرسال التقييم (يمكن ربطها بـ Backend أو واتساب أو تخزين سحابي)
        function submitFeedback(e) {
            e.preventDefault();
            
            const name = document.getElementById('clientName').value;
            const notes = document.getElementById('clientNotes').value;

            if (selectedRating === 0) {
                alert('من فضلك حدد تقييم النجوم أولاً!');
                return;
            }

            // إخفاء النموذج وإظهار رسالة النجاح الاحترافية
            document.getElementById('formContent').style.display = 'none';
            document.getElementById('successBox').style.display = 'block';

            // اختيارياً: لو حابب تبعث التقييم ديركت على واتساب الإدارة:
            /*
            const whatsappUrl = `https://wa.me/201500576313?text=تقييم جديد:%0Aالنجوم: ${selectedRating}/5%0Aالاسم: ${name || 'بدون اسم'}%0Aالملاحظات: ${notes}`;
            setTimeout(() => { window.open(whatsappUrl, '_blank'); }, 1500);
            */
        }
    </script>
</body>
</html>
